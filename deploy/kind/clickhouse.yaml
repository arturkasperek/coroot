apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-cors
  namespace: coroot-dev
data:
  cors.xml: |
    <clickhouse>
      <http_options_response>
        <header>
          <name>Access-Control-Allow-Origin</name>
          <value>*</value>
        </header>
        <header>
          <name>Access-Control-Allow-Headers</name>
          <value>origin, x-requested-with, x-clickhouse-format, x-clickhouse-user, x-clickhouse-key, Authorization</value>
        </header>
        <header>
          <name>Access-Control-Allow-Methods</name>
          <value>POST, GET, OPTIONS</value>
        </header>
        <header>
          <name>Access-Control-Max-Age</name>
          <value>86400</value>
        </header>
      </http_options_response>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: coroot-dev
spec:
  type: NodePort
  selector:
    app: clickhouse
  ports:
    - name: native
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: http
      port: 8123
      targetPort: 8123
      nodePort: 30812
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: coroot-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3
          env:
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
          ports:
            - containerPort: 9000
            - containerPort: 8123
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: cors
              mountPath: /etc/clickhouse-server/config.d/cors.xml
              subPath: cors.xml
      volumes:
        - name: cors
          configMap:
            name: clickhouse-cors
