apiVersion: v1
kind: Service
metadata:
  name: express-demo
  namespace: coroot-dev
spec:
  selector:
    app: express-demo
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: metrics
      port: 9464
      targetPort: 9464
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-demo
  namespace: coroot-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: express-demo
  template:
    metadata:
      labels:
        app: express-demo
      annotations:
        coroot.com/scrape-metrics: "true"
        coroot.com/metrics-port: "9464"
        coroot.com/metrics-path: "/metrics"
    spec:
      containers:
        - name: express-demo
          image: express-demo:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_SERVICE_NAME
              value: express-demo
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://coroot:8080
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 9464
              name: metrics
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-demo
  namespace: coroot-dev
spec:
  selector:
    app: nextjs-demo
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: metrics
      port: 9464
      targetPort: 9464
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-demo
  namespace: coroot-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextjs-demo
  template:
    metadata:
      labels:
        app: nextjs-demo
    spec:
      containers:
        - name: nextjs-demo
          image: nextjs-demo:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_SERVICE_NAME
              value: nextjs-demo
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://coroot:8080
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: EXPRESS_URL
              value: http://express-demo:3000
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 9464
              name: metrics
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-traffic
  namespace: coroot-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-traffic
  template:
    metadata:
      labels:
        app: demo-traffic
    spec:
      containers:
        - name: traffic
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              while true; do
                curl -sf -m 5 http://nextjs-demo:3000/ || true
                curl -sf -m 5 http://express-demo:3000/api/hello || true
                curl -sf -m 5 http://express-demo:3000/api/slow || true
                curl -sf -m 5 http://express-demo:3000/api/error || true
                sleep 3
              done
